services:
  web:
    image: node:22-slim
    working_dir: /app/gallery
    volumes:
      - .:/app
      - gallery_nm:/app/gallery/node_modules
      - gallery_next:/app/gallery/.next
    ports:
      - "3000:3000"
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      - WATCHPACK_POLLING=true
    command: sh -c "npm install && npx next dev -H 0.0.0.0 -p 3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  gallery_nm:
  gallery_next:
