services:
  web:
    image: node:22-slim
    working_dir: /app/bar-digital-menu
    volumes:
      - .:/app
      - bar_nm:/app/bar-digital-menu/node_modules
    ports:
      - "3000:3000"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - WATCHPACK_POLLING=true
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  bar_nm:
